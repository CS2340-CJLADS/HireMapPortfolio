{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HireMap — Team Portfolio</title>
<link rel="stylesheet" href="{% static 'style.css' %}?v=1.2">
<link rel="stylesheet" href="{% static 'accessibility.css' %}">
</head>
<body>

<header class="header">
  <div class="container">
    <nav class="nav">
      <a href="{% url 'home' %}" class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>HireMap — Team Portfolio</span>
      </a>
      <div class="links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'team' %}">Team</a>
        <a href="{% url 'system' %}">System</a>
        <a href="{% url 'process' %}">Process</a>
        <a href="{% url 'video' %}">Video</a>
      </div>
    </nav>
  </div>
</header>

<main id="app">
  {% block content %}
  {% endblock %}
</main>

<footer class="footer">
  <div class="container" style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap">
    <small>© <span id="year"></span> HireMap Team</small>
    <small><a href="{% url 'team' %}">Team</a> · <a href="{% url 'system' %}">System</a> · <a href="{% url 'process' %}">Process</a></small>
  </div>
</footer>

<script src="{% static 'script.js' %}"></script>
</body>
</html>
